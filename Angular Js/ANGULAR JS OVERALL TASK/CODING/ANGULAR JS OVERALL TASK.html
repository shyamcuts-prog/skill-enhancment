<!DOCTYPE html>
<html ng-app="todoApp">
<head>
  <title>Todo App</title>

  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      margin-top: 50px;
    }

    .container {
      background: white;
      padding: 20px;
      width: 350px;
      border-radius: 10px;
      box-shadow: 0 0 10px gray;
    }

    h2 {
      text-align: center;
    }

    input {
      width: 70%;
      padding: 10px;
    }

    button {
      padding: 10px;
      background: blue;
      color: white;
      border: none;
      cursor: pointer;
    }

    li {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      background: #eee;
      padding: 8px;
      border-radius: 5px;
    }

    .delete {
      background: red;
    }
  </style>
</head>

<body ng-controller="TodoController">

  <div class="container">
    <h2>To-Do List</h2>

    <input type="text" ng-model="task" placeholder="Enter task">
    <button ng-click="addTask()">Add</button>

    <ul>
      <li ng-repeat="item in tasks">
        {{item}}
        <button class="delete" ng-click="removeTask($index)">X</button>
      </li>
    </ul>
  </div>

  <script>
    var app = angular.module("todoApp", []);

    app.controller("TodoController", function($scope) {

      $scope.tasks = [];

      $scope.addTask = function() {
        if($scope.task != "") {
          $scope.tasks.push($scope.task);
          $scope.task = "";
        }
      };

      $scope.removeTask = function(index) {
        $scope.tasks.splice(index, 1);
      };

    });
  </script>

</body>
</html>
