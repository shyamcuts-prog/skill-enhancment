<!DOCTYPE html>
<html>
<head>
<style>
.parent{
    position: relative;
    width: 300px;
    height: 200px;
    border: 2px solid black;
}

.child{
    position: absolute;
    top: 20px;
    right: 20px;
    width: 100px;
    height: 100px;
    background-color: rgb(9, 104, 58);
}
</style>
</head>
<body>

<div class="parent">
    <div class="child"></div>
</div>

</body>
</html>
