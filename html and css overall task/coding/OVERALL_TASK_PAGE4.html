<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .success-box {
            background: white;
            width: 400px;
            padding: 40px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .success-icon {
            font-size: 70px;
            color: green;
            margin-bottom: 20px;
        }

        h1 {
            color: #ff6600;
            margin-bottom: 15px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: orange;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .btn:hover {
            background: #e68900;
        }
    </style>
</head>
<body>

    <div class="success-box">

        <div class="success-icon">✓</div>

        <h1>Order Successful!</h1>

        <p>
            Thank you for your order 🍊<br>
            Your fresh orange juice will be delivered soon.
        </p>

        <a href="index.html" class="btn">Back to Home</a>

    </div>

</body>
</html>
